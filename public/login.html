<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل دخول الأدمن - Ramadan Vibes</title>
  <link rel="icon" type="image/webp" href="/assets/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <div class="bg-decor" aria-hidden="true">
    <span class="bg-glow bg-glow-1"></span>
    <span class="bg-glow bg-glow-2"></span>
    <span class="bg-lantern bg-lantern-1"></span>
    <span class="bg-lantern bg-lantern-2"></span>
  </div>

  <main class="login-wrapper">

    <div class="login-card" id="login-card">

      <div class="login-brand">
        <img src="/assets/images/logo.webp" alt="Ramadan Vibes" class="login-logo" width="72" height="72">
        <h1 class="login-title">Ramadan Vibes</h1>
        <p class="login-subtitle">لوحة تحكم الأدمن</p>
      </div>

      <form id="login-form" class="login-form" novalidate autocomplete="on">

        <div class="form-group">
          <label for="username" class="form-label">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="أدخل اسم المستخدم"
            autocomplete="username"
            required
            minlength="3"
            maxlength="64"
            spellcheck="false"
            autocapitalize="off"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">كلمة المرور</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              required
              minlength="6"
              maxlength="128"
            >
            <button
              type="button"
              class="toggle-password"
              id="toggle-password"
              aria-label="إظهار كلمة المرور"
              aria-pressed="false"
            >
              <span class="eye-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="form-message" id="form-message" role="alert" hidden></div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-text">تسجيل الدخول</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

      </form>

      <div class="login-footer">
        <a href="/" class="back-link">العودة إلى الصفحة الرئيسية</a>
      </div>

    </div>

  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
